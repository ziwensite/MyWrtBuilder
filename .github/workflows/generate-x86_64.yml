# This workflow uses ImmortalWrt ImageBuilder to generate custom x86_64 firmware
name: Build Custom ImmortalWrt Firmware (ImageBuilder)

on:
  workflow_dispatch:
    inputs:
      release: 
        description: 'Upload firmware to Release'
        required: false
        default: 'true'
      upload-all:
        description: 'Upload all images to Artifacts'
        required: false
        default: 'false'

env:
  # Use the latest available RELEASE (as of your knowledge base)
  #DOWNLOAD_BASE: https://downloads.immortalwrt.org
  DOWNLOAD_BASE: https://mirrors.pku.edu.cn/immortalwrt
  VENDOR: immortalwrt
  VERSION: 24.10.4
  TARGET: x86/64
  IB_DIR: ${{ github.workspace }}/${{ env.VENDOR }}-imagebuilder-${{ env.VERSION }}-x86-64.Linux-x86_64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget tar zstd

      - name: Set Environment Variables
        run: |
          echo "DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          echo "DATETIME=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Checkout Custom Configs (Optional)
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Download Official ImageBuilder
        run: |
          wget ${DOWNLOAD_BASE}/releases/${VERSION}/targets/x86/64/${VENDOR}-imagebuilder-${VERSION}-x86-64.Linux-x86_64.tar.zst
          tar -I zstd -xf ${VENDOR}-imagebuilder-${VERSION}-x86-64.Linux-x86_64.tar.zst
          rm ${VENDOR}-imagebuilder-${VERSION}-x86-64.Linux-x86_64.tar.zst

      - name: (Optional) Download Extra .ipk Packages
        working-directory: ${{ env.IB_DIR }}
        run: |
          # Example: download extra packages from official repo
          mkdir -p packages-extra
          # Replace with your needed packages, e.g.:
          # wget -P packages-extra https://downloads.immortalwrt.org/releases/${VERSION}/targets/x86/64/packages/luci-app-advanced-reboot_*.ipk
          # Or use your own external-package-urls.txt containing .ipk URLs
          if [ -f "${{ github.workspace }}/custom/external-package-urls.txt" ]; then
            cat ${{ github.workspace }}/custom/external-package-urls.txt | xargs -I {} wget -P packages-extra {}
          fi

      - name: Copy Custom Files (e.g. uci-defaults, banner, etc.)
        working-directory: ${{ env.IB_DIR }}
        run: |
          # Copy custom files into ImageBuilder root
          if [ -d "${{ github.workspace }}/custom/files" ]; then
            cp -r ${{ github.workspace }}/custom/files .
          fi
          # Copy custom uci-defaults script (runs on first boot)
          if [ -f "${{ github.workspace }}/custom/uci-custom" ]; then
            mkdir -p files/etc/uci-defaults
            cp ${{ github.workspace }}/custom/uci-custom files/etc/uci-defaults/99-custom
            chmod +x files/etc/uci-defaults/99-custom
          fi

      - name: Build Firmware
        working-directory: ${{ env.IB_DIR }}
        run: |
          # Use make image with your custom profile/config
          # You can define PROFILE in a file or inline
          make image \
            PROFILE="generic" \
            PACKAGES="-ppp -ppp-mod-pppoe -firewall luci ca-bundle curl nano vim htop" \
            FILES="./files" \
            EXTRA_PACKAGES_DIR="./packages-extra"

      - name: Upload VDI (Dev Only)
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-vdi-${{ env.DATETIME }}
          path: ${{ env.IB_DIR }}/bin/targets/x86/64/*.vdi

      - name: Upload All Artifacts
        if: github.event.inputs.upload-all == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-all-${{ env.DATETIME }}
          path: ${{ env.IB_DIR }}/bin/targets/x86/64/*

      - name: Upload to Release
        if: github.event.inputs.release == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: ${{ env.IB_DIR }}/bin/targets/x86/64/*
          asset_name: ${{ env.DATE }}-immortalwrt-custom
          tag: release-${{ env.DATE }}
          overwrite: true
